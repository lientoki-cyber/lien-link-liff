<html lang="ja">

/* Layout: スマホ1カラム。1画面1問のカード式 → 結果は縦に「おすすめ→理由→費用→ゴールまでの地図→次の一歩」 */
:root{
  --bg:#FBF3F6; --surface:#FFFFFF; --ink:#3A1F2A; --muted:#7A6570; --line:#EBD3DE;
  --plum:#48222F; --rose:#C2457F; --rose-soft:#F6E1EB; --gold:#B08A4E; --gold-soft:#F5ECDD;
  --adv:#1F3F8F; --adv-soft:#E4EAF7; --std:#4F86B8; --std-soft:#E3EEF7; --ar:#D2679A; --ar-soft:#FBE6F0;
  --ok:#2E7D5B;
  --f:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1418; --surface:#2A1D23; --ink:#F6E9EE; --muted:#C2AAB5; --line:#4A3540;
  --plum:#F3D3E0; --rose:#F08DBB; --rose-soft:#43283A; --gold:#E0BE85; --gold-soft:#3A2F22;
  --adv:#9DB6F2; --adv-soft:#24304D; --std:#93C0E6; --std-soft:#203243; --ar:#F3A3C8; --ar-soft:#46283A; --ok:#7FD1A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1418; --surface:#2A1D23; --ink:#F6E9EE; --muted:#C2AAB5; --line:#4A3540;
  --plum:#F3D3E0; --rose:#F08DBB; --rose-soft:#43283A; --gold:#E0BE85; --gold-soft:#3A2F22;
  --adv:#9DB6F2; --adv-soft:#24304D; --std:#93C0E6; --std-soft:#203243; --ar:#F3A3C8; --ar-soft:#46283A; --ok:#7FD1A9; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--rose)}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;border:0;font:inherit;font-weight:700;font-size:16px;text-align:center;cursor:pointer;text-decoration:none}
.btn.main{background:var(--plum);color:var(--bg)}
.btn.sub{background:var(--surface);color:var(--rose);border:1.5px solid var(--rose)}
.btn.quiet{background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:10px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* ナビ（案内役） */
.navi{display:flex;gap:12px;align-items:flex-start}
.navi .face{flex:none;width:52px;height:52px;border-radius:50%;background:var(--rose-soft);display:grid;place-items:center}
.navi .face svg{width:34px;height:34px}
.bubble{position:relative;min-width:0;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:15px}
.bubble b{color:var(--rose)}
.navi-name{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}

/* トップ */
.hero{padding:8px 4px 0;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:28px;font-weight:900;color:var(--plum)}
.hero .lead{font-size:15px;color:var(--muted)}
.ladder-mini{display:flex;gap:6px;flex-wrap:wrap}
.ladder-mini span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ladder-mini span.g1,.rung .lv.g1{background:color-mix(in srgb,var(--rose) 10%,var(--surface));color:var(--plum);border-color:transparent}
.ladder-mini span.g2,.rung .lv.g2{background:color-mix(in srgb,var(--rose) 22%,var(--surface));color:var(--plum);border-color:transparent}
.ladder-mini span.g3,.rung .lv.g3{background:color-mix(in srgb,var(--rose) 38%,var(--surface));color:var(--plum);border-color:transparent}
.ladder-mini span.g4,.rung .lv.g4{background:color-mix(in srgb,var(--rose) 58%,var(--surface));color:var(--surface);border-color:transparent}
.ladder-mini span.g5,.rung .lv.g5{background:color-mix(in srgb,var(--rose) 80%,var(--surface));color:var(--surface);border-color:transparent}

/* 質問 */
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:999px;transition:width .35s ease}
.count{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q h2{font-size:21px;font-weight:900;color:var(--plum)}
.q .hint{margin-top:6px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--rose)}
.opt:active{transform:scale(.98)}
.opt .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--rose-soft);display:grid;place-items:center;font-size:18px;color:var(--rose);font-weight:900}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.opt.on{border-color:var(--rose);background:var(--rose-soft)}

/* 結果 */
.result-head{border-radius:24px;padding:22px 20px;color:var(--surface);display:flex;flex-direction:column;gap:8px}
.result-head .eyebrow{color:inherit;opacity:.85}
.result-head h2{font-size:30px;font-weight:900}
.result-head .catch{font-size:16px;font-weight:700}
.result-head.adv{background:var(--adv)} .result-head.std{background:var(--std)} .result-head.ar{background:var(--ar)}
.result-head.trial{background:var(--gold)} .result-head.line{background:var(--rose)}
.type{display:inline-block;align-self:flex-start;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.22)}
.sec h3{font-size:17px;font-weight:900;color:var(--plum);margin-bottom:10px}
.reasons{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.reasons li{display:flex;gap:10px;font-size:15px}
.reasons li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--rose)}
.money{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-variant-numeric:tabular-nums}
.money dt{color:var(--muted);font-size:14px}
.money dd{margin:0;text-align:right;font-weight:700}
.money .total{border-top:1px solid var(--line);padding-top:8px;font-size:18px;color:var(--plum)}
.money .total dd{font-size:22px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip.yes{border-color:var(--ok);color:var(--ok)}
.chip.no{color:var(--muted);text-decoration:line-through}
.gets{margin:0;padding-left:1.2em;font-size:14.5px;display:grid;gap:4px}

/* ゴールまでの地図 */
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.rung{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.rung .lv{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--line);color:var(--muted)}
.rung b{flex:1;min-width:0}
.rung em{font-style:normal;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.rung.now em{background:var(--line);color:var(--ink)}
.rung.rec{border:2px solid var(--rose);background:var(--rose-soft)}
.rung.rec .lv{background:var(--rose);color:var(--surface)}
.rung.rec em{background:var(--rose);color:var(--surface)}
.rung.goal em{background:var(--line);color:var(--muted)}

/* 比較 */
.cmp-wrap{overflow-x:auto;margin:0 -4px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp thead th{font-size:12px;color:var(--muted)}
.cmp td.adv{color:var(--adv);font-weight:900}
.example{background:var(--adv-soft);border-radius:16px;padding:14px 16px;font-size:14.5px}
.example strong{color:var(--adv);font-size:18px}

.fit{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.fit .ring{position:relative;width:180px;height:180px;max-width:100%}
.fit .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fit .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:900;color:var(--rose);font-variant-numeric:tabular-nums}
.fit .ring b small{font-size:20px}
.fit h2{font-size:21px;font-weight:900;color:var(--plum)}
.fit p{font-size:15px;text-align:left}
.fitbadge{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--rose-soft)}
.fitbadge b{font-size:28px;font-weight:900;color:var(--rose);font-variant-numeric:tabular-nums}
.bandname{font-size:13px;font-weight:700;color:var(--muted)}
.axes{display:grid;gap:10px}
.axis{display:grid;grid-template-columns:8.5em 1fr 3.4em;align-items:center;gap:10px;font-size:13.5px}
.axis i{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.axis em{display:block;height:100%;background:var(--rose);border-radius:999px}
.axis small{font-size:12px;font-weight:700;color:var(--muted);text-align:right}
.phase{font-size:12px;font-weight:700;color:var(--rose);letter-spacing:.06em}
.staff{border:2px dashed var(--gold);background:var(--gold-soft)}
.staff dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}
.staff dt{color:var(--muted)}
.staff dd{margin:0;font-weight:700;min-width:0}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.actions{display:grid;gap:10px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}

      '<p class="lead">お店を続けていると、うれしいことも、迷うことも、いろいろありますよね。お客様への想い。商品の選び方。これからのお店のこと。普段のお仕事を思い浮かべながら、あなたのお考えに近いものを選んでください。</p></section>'+
      navi('全部で12問、約3分です。難しく考えず、いつものあなたらしくお答えください。<b>あなたのお店とリアンの想いがどれくらい近いのか</b>、一緒に見つけていきましょう。')+
      '<div class="card"><p class="muted" style="margin-bottom:8px">リアンとのお付き合いは、この道のりで深まっていきます</p>'+
      '<div class="ladder-mini">'+LADDER.map(function(l,i){return '<span class="g'+(i+1)+'">'+l.t+'</span>';}).join('')+'</div></div>'+
      '<button class="btn main" id="go">診断をはじめる</button><button class="btn quiet" id="back0">← ひとつ前にもどる</button>'+
      '<p class="note">※ フィット感は、回答から計算した価値観への共感の目安です。人柄や経営の良し悪しを評価するものではありません。関わり方の診断も目安で、正式なプランは担当者とのご相談で決まります。お名前や連絡先の入力は不要です。</p>';
    document.getElementById('back0').onclick = goHome;
    document.getElementById('go').onclick = function(){ A = {}; if (PRESET_STAGE!==null) A.stage = PRESET_STAGE; step = 0; phase = 'fit'; ask(); };
  }

  function ask(){
    var ids = order(), id = ids[step], q = Q.concat(VQ).filter(function(x){return x.id===id;})[0];
    var pct = Math.round(step/ids.length*100);
    app.innerHTML =
      '<p class="phase">'+(phase==='fit'?'STEP 1｜想いの重なり・'+q.theme:'STEP 2｜あなたに合う関わり方')+'</p><div class="progress"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="count">'+(step+1)+' / '+ids.length+'</span></div>'+
      (q.say?navi(q.say):'')+
      '<section class="card q fade"><h2>'+q.title+'</h2>'+(q.hint?'<p class="muted hint">'+q.hint+'</p>':'')+
      '<div class="opts">'+q.opts.map(function(o,i){
        return '<button class="opt'+(A[id]===o.v?' on':'')+'" data-i="'+i+'" data-v="'+o.v+'"><span class="ic" aria-hidden="true">'+o.ic+'</span><span><b>'+o.t+'</b>'+(o.s?'<small>'+o.s+'</small>':'')+'</span></button>';
      }).join('')+'</div></section>'+
      (step>0?'<button class="btn quiet" id="back">← ひとつ前にもどる</button>':'<button class="btn quiet" id="back">はじめの画面へ</button>');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(el){
      el.onclick = function(){
        A[id] = q.opts[+el.getAttribute('data-i')].v; el.classList.add('on');
        setTimeout(function(){ var ids2 = order(); if (step < ids2.length-1){ step++; ask(); } else if (phase==='fit') thanks(); else result(); }, 180);
      };
    });
    document.getElementById('back').onclick = function(){ if (step>0){ step--; ask(); } else if (phase==='plan'){ fitResult(); } else top(); };
    window.scrollTo(0,0);
  }

  function thanks(){
    app.innerHTML = '<section class="fit fade" style="text-align:left;align-items:stretch"><p class="eyebrow">THANK YOU</p><h2>12の質問にお答えいただき、ありがとうございました。</h2>'+
      '<p>お仕事に対する想いを、少しだけ知ることができました。</p>'+
      '<p>私たちリアンも、「大切な人を、大切にする。」という考え方を大切にしています。</p>'+
      '<p>お客様も、お店の皆さまも、そして私たちも。ご縁のある皆さまが、ともに豊かになっていけたら。そんな想いで、商品づくりや販売店様のサポートに取り組んでいます。</p>'+
      '<p><b>それでは、あなたのお店とリアンの想いの重なりを見てみましょう。</b></p></section>'+
      '<button class="btn main" id="see">診断結果を見る</button><button class="btn quiet" id="back3">← ひとつ前にもどる</button>';
    document.getElementById('see').onclick = fitResult;
    document.getElementById('back3').onclick = function(){ step = VQ.length-1; ask(); };
    window.scrollTo(0,0);
  }

  function fitResult(){
    sendDx('none');
    var d = fitDetail(), p = d.pct, b = band(p), C = 2*Math.PI*80;
    var strong = AXES.filter(function(a){return d.per[a.k]>=.75;}), weak = AXES.filter(function(a){return d.per[a.k]<.45;});
    var body;
    if (b.k>=4) {
      body = '「大切な人を、大切にする。」この言葉に込めた想いと、あなたが日々のお仕事で大切にされていることには、多くの共通点があるようです。'+
        (strong.length?'とくに<b>'+strong.slice(0,3).map(function(a){return a.n;}).join('・')+'</b>への考え方が重なっていました。':'')+
        '私たちは、そんな価値観を共有できる方と一緒に仕事ができることを、うれしく思います。';
    } else if (b.k>=2) {
      body = (strong.length?'<b>'+strong.slice(0,2).map(function(a){return a.n;}).join('・')+'</b>では、リアンと通じる考え方をお持ちです。':'リアンと通じるところがありました。')+
        (weak.length?'一方で、<b>'+weak.slice(0,2).map(function(a){return a.n;}).join('・')+'</b>では、大切にする順番が少し違うようです。':'')+
        'お互いの考え方を、もう少し知り合えたらうれしいです。';
    } else {
      body = 'リアンでは、'+(weak.length?weak.slice(0,2).map(function(a){return a.lien;}).join('、そして'):AXES[0].lien)+'を大切にしています。'+
        (d.tags.length?'一方で、あなたは<b>'+d.tags.join('</b>や<b>')+'</b>を重視されているようです。':'')+
        'どちらが正しいということではありません。ただ、いまは、お互いが大切にしていることを知るところから始めるのがよいかもしれません。';
    }
    app.innerHTML = '<section class="fit fade"><p class="eyebrow">あなたのお店とリアンの、想いの重なりは…</p>'+
      '<div class="ring"><svg viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="80" fill="none" stroke="var(--line)" stroke-width="14"/>'+
      '<circle id="arc" cx="90" cy="90" r="80" fill="none" stroke="var(--rose)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1.4s ease"/></svg>'+
      '<b><span><span id="pct">0</span><small>%</small></span></b></div>'+
      '<p class="bandname">'+b.h+'</p><h2>'+b.lead+'</h2><p>'+body+'</p></section>'+
      '<section class="card sec"><h3>6つの価値観、それぞれの重なり</h3><div class="axes">'+
      AXES.map(function(a){ var r = d.per[a.k]; return '<div class="axis"><span>'+a.n+'</span><i><em style="width:'+Math.round(r*100)+'%"></em></i><small>'+lvl(r)+'</small></div>'; }).join('')+
      '</div><p class="note" style="margin-top:10px">フィット感は、リアンが大切にしている価値観と、今回のご回答がどれくらい重なっているかの目安です。人柄や経営者としての力を評価するものではありません。</p></section>'+
      (b.k>=3
        ? navi('リアンの商品を、あなたのお店でも取り扱ってみませんか？<b>あと少しだけ</b>、お店のことを教えてください。')+
          '<button class="btn main" id="next">リアンの取扱プランを見る</button><button class="btn sub" id="mind">リアンが大切にしている想いを見る</button>'
        : navi('この数字をきっかけに、ぜひスタッフと話してみてください。「どうしてこの数字なんだろう？」から始まる会話も、大歓迎です。')+
          '<button class="btn main" id="mind">リアンが大切にしている想いを見る</button><button class="btn sub" id="next">それでも取り扱いについて聞いてみる</button>')+
      '<button class="btn quiet" id="redo">もう一度診断する</button>'+HOME_BTN;
    var arc = document.getElementById('arc'), el = document.getElementById('pct'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce){ arc.style.transition='none'; arc.setAttribute('stroke-dashoffset', C*(1-p/100)); el.textContent = p; }
    else {
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ arc.setAttribute('stroke-dashoffset', C*(1-p/100)); }); });
      var t0 = null; (function tick(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/1400); el.textContent = Math.round(p*k); if(k<1) requestAnimationFrame(tick); })(performance.now());
    }
    document.getElementById('next').onclick = function(){ phase = 'plan'; step = 0; ask(); };
    document.getElementById('mind').onclick = mind;
    document.getElementById('redo').onclick = top; bindHome();
    window.scrollTo(0,0);
  }
  function mind(){
    app.innerHTML = '<section class="hero fade"><p class="eyebrow">LIEN PHILOSOPHY</p><h1>大切な人を、大切にする。</h1>'+
      '<p class="lead">リアンが、いちばん大切にしている言葉です。</p></section>'+
      '<section class="card sec"><h3>めざす社会</h3><p>からだ・こころ・くらし。「三つの健康」が満たされた社会。</p></section>'+
      '<section class="card sec"><h3>大切にしている3つのこと</h3><ul class="reasons">'+
      '<li><span><b>愛</b>　可能性を信じ、誠意を尽くす</span></li><li><span><b>絆</b>　ご縁に感謝し、ご縁を紡ぐ</span></li><li><span><b>真心</b>　大切な人を大切にする</span></li></ul></section>'+
      '<section class="card sec"><h3>リアンの約束</h3><ul class="reasons">'+
      '<li>短期的な売上よりも、長期的な信頼関係を大切にします。</li>'+
      '<li>店舗様が自信を持って推薦できる商品をお届けします。</li>'+
      '<li>価格競争ではなく、信頼競争で応えます。</li>'+
      '<li>お客様の「今」だけでなく、「これから」の健康まで見据えます。</li>'+
      '<li>商品で選ばれる会社ではなく、人で選ばれる会社に。</li></ul></section>'+
      '<section class="card sec"><h3>販売店様と、こんな関係でいたい</h3><p>誰にでも扱っていただきたいのではなく、商品の価値を正しく理解し、責任を持ってご提案いただけるお店と、長くお付き合いしたいと考えています。取扱店様の価値を守り、成功をともにめざすパートナーとして、継続してサポートします。</p></section>'+
      '<button class="btn main" id="back2">結果にもどる</button>'+HOME_BTN;
    document.getElementById('back2').onclick = fitResult; bindHome();
    window.scrollTo(0,0);
  }

  function ladderHtml(rec){
    var nowIdx = A.stage===4 ? 1 : A.stage>=2 ? 0 : -1;
    return '<div class="ladder">'+LADDER.map(function(l,i){
      var cls = 'rung', tag = '';
      if (l.k===rec){ cls+=' rec'; tag='<em>おすすめ</em>'; }
      else if (i===nowIdx){ cls+=' now'; tag='<em>いまここ</em>'; }
      if (l.k==='adv' && rec!=='adv'){ cls+=' goal'; tag='<em>その先に</em>'; }
      
      return '<div class="'+cls+'"><span class="lv g'+(i+1)+'">'+(i+1)+'</span><b>'+l.t+'<br><span class="muted">'+l.d+'</span></b>'+tag+'</div>';
    }).join('')+'</div>';
  }

  function advCompare(){
    var rows = [['BASE','13,500円','60%','50%'],['PASTE','15,000円','60%','50%'],['SUPPLEMENT','8,000円','60%','50%'],['SEED','8,000円','60%','50%'],['PLUM','6,500円','60%','55%']];
    return '<section class="card sec"><h3>アドバンスになると、仕入れはどう変わる？</h3>'+
      '<p class="muted" style="margin-bottom:10px">b-ternalの仕入れ（掛け率）は、アドバンスがいちばんお得です。</p>'+
      '<div class="cmp-wrap"><table class="cmp"><thead><tr><th>b-ternal（希望小売・税抜）</th><th>スタンダード</th><th>アドバンス</th></tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td>'+r[0]+'<br><span class="muted">'+r[1]+'</span></td><td>最大 '+r[2]+'</td><td class="adv">最大 '+r[3]+'</td></tr>'; }).join('')+
      '</tbody></table></div>'+
            '<p class="note" style="margin-top:8px">※ 掛け率は、ご注文の数量によって変わります。くわしくはスタッフがご案内します。導入費用の差は5万円です。</p></section>';
  }

  function result(){
    var r = judge();
    sendDx(r.plan);
    var P = PLAN[r.plan], isPlan = (r.plan==='adv'||r.plan==='std'||r.plan==='ar'), lowFit = fitDetail().pct < 35;
    if (lowFit && isPlan) r.note = (r.note?r.note+' ':'')+'今回はフィット感がまだ低めでした。お取り扱いについては、まずスタッフと一度お話ししてから、お互いに決めさせてください。';
    var fd = fitDetail(), fp = fd.pct, fb = band(fp);
    var html = '<div class="fitbadge fade"><b>'+fp+'%</b><span><span class="muted">あなたのお店とリアンの想いの重なり</span><br><strong>'+fb.lead+'</strong></span></div>'+
      '<section class="result-head '+r.plan+' fade"><p class="eyebrow">あなたに合うリアンとの関わり方は</p>'+
      '<h2>'+P.name+'</h2><p class="catch">'+P.catch+'</p><span class="type">'+P.type+'</span></section>';
    html += navi({
      adv:'お店の柱として、リアンの商品を本格的に育てていける準備が整っています。<b>一緒に、アドバンスを目指しましょう！</b>',
      std:'3ブランドを、お店に合った形で着実に。販売が育ってきたら、<b>アドバンス</b>への道も開けています。',
      ar:'AID・realityから始めて、お客様の喜ぶ声を増やしていきましょう。その先に<b>スタンダード・アドバンス</b>があります。',
      trial:'まずは、あなた自身で試してみてください。<b>実感した良さ</b>は、きっとお客様にも伝わります。その先に、お店に合うプランがあります。',
      line:'焦らなくて大丈夫です。まずはリアンを知っていただくところから。<b>ご縁</b>を大切にお付き合いさせてください。'
    }[r.plan]);
    html += '<section class="card sec"><h3>この結果になった理由</h3><ul class="reasons">'+r.reasons.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>'+
      (r.note?'<p class="note" style="margin-top:10px">'+r.note+'</p>':'')+'</section>';
    if (P.trial) {
      html += '<section class="card sec"><h3>はじめるときの費用（税抜）</h3><dl class="money">'+
        '<dt>導入費用</dt><dd>0円</dd>'+
        '<dt>商品のご購入（展示会期間中）</dt><dd>'+yen(P.buy)+'〜</dd>'+
        '<dt class="total">お試し期間</dt><dd class="total">2か月</dd></dl>'+
        '<p class="note" style="margin-top:8px">展示会期間中に、商品を3万円以上（税抜）ご購入いただいた方が対象です。仕入れ総額3万円（税抜）以上のご発注で送料無料。くわしい条件はスタッフがご案内します。</p></section>';
    }
    if (isPlan) {
      html += '<section class="card sec"><h3>はじめるときの費用（税抜）</h3><dl class="money">'+
        '<dt>導入費用（最初の1回だけ）</dt><dd>'+yen(P.fee)+'</dd>'+
        '<dt>最初の商品のご購入</dt><dd>'+yen(P.buy)+'〜</dd>'+
        '<dt class="total">合計</dt><dd class="total">'+yen(P.fee+P.buy)+'〜</dd></dl>'+
        '<p class="note" style="margin-top:8px">更新料やノルマはありません。商品のご購入分は、お店で販売していただく商品です。仕入れ総額3万円（税抜）以上のご発注で送料無料。</p></section>';
      html += '<section class="card sec"><h3>取り扱えるブランド</h3><div class="chips">'+
        '<span class="chip '+(P.brands.bt?'yes':'no')+'">b-ternal</span><span class="chip yes">AID</span><span class="chip yes">reality</span></div></section>';
    }
    html += '<section class="card sec"><h3>'+(isPlan||P.trial?'このプランでできること':'このステップでできること')+'</h3><ul class="gets">'+P.gets.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></section>';
    html += '<section class="card sec"><h3>あなたのお店の、これからの道のり</h3>'+ladderHtml(r.plan)+
      '<p class="note" style="margin-top:10px">順番に上がる必要はありません。最初からアドバンスで始めることもできます。</p></section>';
    if (r.plan!=='adv' && r.plan!=='line') html += advCompare();
    // スタッフ用
    var labels = {stage:['はじめて','LINE友だち','LINE店舗登録済','Bカート登録済','トライアル中'],
      brand:{bt:'b-ternal',ar:'AID・reality',all:'3ブランド',unknown:'未定'},
      heat:['情報収集','少しずつ','しっかり','事業の柱'], vol:['未定','1〜5個','6〜11個','12個以上'],
      when:['未定','3か月以内','1か月以内'], use:{try:'まず試したい',sell:'店販',menu:'施術・カウンセリングと組み合わせ',core:'お店の柱'}};
    var bud = {10:'15万円未満',15:'15〜20万円',20:'20〜25万円',25:'25万円以上','-1':'未定'}[String(A.budget)] || '—';
    var rows = [['フィット感',fp+'%（'+fb.h+'）'],['理念への共感',lvl(fd.per.care)],['お客様への誠実さ',lvl(fd.per.honest)],['信頼関係・約束',lvl(fd.per.trust)],['三つの健康',lvl(fd.per.health)],['確認したいこと',fd.gap?'理念には共感／場面の判断では売上寄り。会話で確かめる':(fp<35?'まず理念を知っていただく。取引は担当者が確認':'—')],['おすすめ',P.name],['現在',labels.stage[A.stage]],['業態',A.biz],['使い方',labels.use[A.use]],['ブランド',labels.brand[A.brand]],['熱量',labels.heat[A.heat]],
      ['予算',bud],['月の数量',A.vol===undefined?'—':labels.vol[A.vol]],['開始',labels.when[A.when]]];
    html += '<section class="card staff" id="staff"><h3 style="font-size:16px">スタッフ確認用メモ</h3><p class="muted">この画面をスタッフにお見せください。</p><dl>'+
      rows.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>';}).join('')+'</dl></section>';
    html += '<div class="actions">';
    // 次の一歩はすべて「LINEの店舗登録アプリ」へ。未登録なら店舗登録から、登録済みなら次の画面（住所・パスワード＝ご注文用の会員登録）から始まる。
    var reg = A.stage>=2, ordered = A.stage>=3;
    var label = !reg ? (r.plan==='trial' ? 'LINEでお店を登録して、トライアルを始める' : 'LINEでお店を登録する（無料）')
              : ordered ? 'LINEの店舗登録アプリから、ご注文画面へ'
              : 'ご注文用の会員登録へ（住所とパスワード）';
    var guide = !reg ? 'まずLINEでお店を登録します（約3分）。そのあと、住所とパスワードを決めると、ご注文の準備が整います。'
              : ordered ? 'ご登録はお済みです。LINEの店舗登録アプリから、そのままご注文画面を開けます。'
              : 'お店の登録はお済みです。次の画面の「今すぐ注文する」から、住所とパスワードを決めるだけで、ご注文の準備が整います。';
    if (lowFit && isPlan) { label = (reg ? '店舗登録アプリに戻る' : 'LINEでお店を登録する（無料）')+'（取り扱いはスタッフとご相談のうえで）'; }
    html += '<p class="note" style="font-size:13px">'+guide+'</p><a class="btn main" href="'+LINKS.liff+'" rel="noopener">'+label+'</a>'+
'<button class="btn quiet" id="again">もう一度診断する</button>'+HOME_BTN+'</div>'+
      '<p class="note">※ 金額はすべて税抜です。掛け率は商品と1回の仕入れ数量で決まります。正式な条件は担当者が確認してご案内します。</p>';
    app.innerHTML = html;
    document.getElementById('again').onclick = top; bindHome();
    window.scrollTo(0,0);
  }

  top();
})();
</script>
